name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save acorn@8.14.0
      - name: Generated language pages are up to date
        run: node tools/build-languages.js --check
      - name: Static checks
        run: node tools/check.js
